[versions]
agp = "8.8.2"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
coreKtx = "1.15.0"
coroutines = "1.10.2"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
