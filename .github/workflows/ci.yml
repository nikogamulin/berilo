name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translator:
    name: Translator (pytest + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        working-directory: translator
        run: pip install -e ".[dev]"

      # No API key is configured, so every LLM call in the suite is mocked.
      # A test that tries to reach a provider will fail here — which is the point.
      - name: Tests
        working-directory: translator
        run: python -m pytest -q

      - name: Lint
        working-directory: translator
        run: |
          python -m black --check .
          ruff check .

  android:
    name: Android (unit tests + debug APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: berilo-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  secrets:
    name: Secret scan (CLAUDE.md §7)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No keys or local paths in tracked files
        run: |
          set -euo pipefail
          # The home-dir pattern is written with a character class so this file
          # does not literally contain the string it searches for — otherwise
          # the scan documented in CLAUDE.md §7 would need a ':!.github/'
          # exclusion, and weakening the canonical scan to accommodate the
          # scanner is the wrong trade.
          PATTERN='sk-(proj|ant)|api[0]3|/home/nik[o]'
          # Exclusions are exactly the docs that describe the scan itself.
          if git grep -nIE "$PATTERN" -- \
               ':!CLAUDE.md' ':!docs/rubric.md' ':!.claude/'; then
            echo "::error::possible secret or local path in a tracked file"
            exit 1
          fi
          echo "clean"
