name: Release APK

# Publishes an installable APK to the GitHub Releases page.
#
# Trigger: push a tag like v0.1.0, or run manually from the Actions tab.
#
# Signing: if the ANDROID_KEYSTORE_BASE64 secret is present the APK is signed
# with the real upload key; otherwise android/app/build.gradle.kts falls back to
# debug signing so a build is always downloadable. A debug-signed build is
# clearly marked in the release notes — installing one and later upgrading to a
# properly signed build requires an uninstall, because the signatures differ.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Created if it does not exist."
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The `secrets` context is not available in `if:` conditions, so the
    # keystore secret is mapped to an env var the conditional can read.
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Restore signing keystore
        id: signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        working-directory: android
        run: ./gradlew test --no-daemon

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Stage the artifact under a versioned name
        id: stage
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          SRC=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$SRC" || { echo "::error::no APK produced"; exit 1; }
          DEST="berilo-${TAG}.apk"
          cp "$SRC" "$DEST"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$DEST" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$DEST" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Never ship a keystore or a key
        run: |
          set -euo pipefail
          rm -f android/keystore.properties
          if git status --porcelain | grep -q keystore.properties; then
            echo "::error::keystore.properties still present in the tree"; exit 1
          fi

      - name: Compose release notes
        id: notes
        run: |
          set -euo pipefail
          {
            echo "Berilo reader — \`${{ steps.stage.outputs.tag }}\`"
            echo
            echo "\`${{ steps.stage.outputs.apk }}\` · minSdk 26 (Android 8.0+) · \`arm64\`/universal"
            echo
            echo "\`sha256: ${{ steps.stage.outputs.sha256 }}\`"
            echo
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "Signed with the project upload key."
            else
              echo "> **Debug-signed build.** No release keystore is configured, so this APK"
              echo "> is signed with the standard Android debug key. It installs and runs, but"
              echo "> it is not a distribution build: upgrading to a properly signed release"
              echo "> later will require uninstalling this one first (signature mismatch)."
            fi
            echo
            echo "**Install:** enable install-from-unknown-sources for your browser or file"
            echo "manager, download the APK, and open it. On a Boox device, sideload over USB"
            echo "with \`adb install -r ${{ steps.stage.outputs.apk }}\`."
            echo
            echo "You supply your own book files and your own LLM API key; Berilo ships neither."
          } > RELEASE_NOTES.md

      - name: Publish the release with the APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: Berilo ${{ steps.stage.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: ${{ steps.stage.outputs.apk }}
          fail_on_unmatched_files: true
