[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "berilo-translator"
version = "0.1.0"
description = "Berilo translator CLI — PDF/EPUB/MOBI in, meaning-preserving translated EPUB out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Niko Gamulin", email = "niko.gamulin@gmail.com" }]
dependencies = [
    "click>=8.1",
    "pymupdf>=1.24",
    "openai>=1.50",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.scripts]
berilo = "berilo.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "black>=24.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["berilo*"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
